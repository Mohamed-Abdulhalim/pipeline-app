name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee build.log; then
            exit 0
          fi
          msg=$( (grep -A14 "What went wrong" build.log || tail -40 build.log) | head -60 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Gradle failure::${msg}"
          exit 1

      - run: cp android/app/build/outputs/apk/release/app-release.apk pipeline.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pipeline.apk --title "Pipeline build ${{ github.run_number }}" --notes "Install pipeline.apk on your phone."
